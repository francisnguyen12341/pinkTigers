<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Notes Graph</title>
    <!--Cytoscape script-->
    <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
    <!--EasyMDE-->
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>

    <!--BOOTSTRAP CSS & JS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        #cy {
            width: 100%;
            height: 80vh;
            border: 1px solid #000000;
        }

        button {
            margin: 10px;
            padding: 8px 16px;
            font-size: 16px;
        }

        #editorModal {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgb(255, 255, 255);
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            width: 600px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            padding-top: 20px;
        }

        /* Style the sidenav links and the dropdown button */
        .sidenav a,
        .dropdown-btn {
            padding: 6px 8px 6px 16px;
            text-decoration: none;
            font-size: 20px;
            color: #818181;
            display: block;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            outline: none;
        }

        /* On mouse-over */
        .sidenav a:hover,
        .dropdown-btn:hover {
            color: #f1f1f1;
        }

        /* Main content */
        .main {
            margin-left: 200px;
            /* Same as the width of the sidenav */
            font-size: 20px;
            /* Increased text to enable scrolling */
            padding: 0px 10px;
        }

        /* Add an active class to the active dropdown button */
        .active {
            background-color: green;
            color: white;
        }

        /* Dropdown container (hidden by default). Optional: add a lighter background color and some left padding to change the design of the dropdown content */
        .dropdown-container {
            display: none;
            background-color: #262626;
            padding-left: 8px;
        }

        /* Optional: Style the caret down icon */
        .fa-caret-down {
            float: right;
            padding-right: 8px;
        }
    </style>
</head>

<body>
    <div id="sideNav"></div>
    <div class="main">
        <h2>Notes Visualization</h2>
        <button id="addNodeButton">Add Node</button>
        <div id="cy"></div>

        <!--this is the mark up stuff-->
        <div id="editorModal">
            <textarea id="editorArea"></textarea>
            <br>
            <button id="saveNodeText">Save</button>
            <button id="cancelEditor">Cancel</button>
        </div>

        <!-- this is the editor modal stuff-->
        <div id="nodeContextMenu" class="card shadow-sm" style="
        position: absolute;
        display: none;
        z-index: 2000;
        width: 180px;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        ">
            <div class="list-group list-group-flush">
                <button class="list-group-item list-group-item-action border-0" id="renameNodeBtn">
                    ✏️ Rename Node
                </button>
                <button class="list-group-item list-group-item-action text-danger border-0" id="deleteNodeBtn">
                    🗑️ Delete Node
                </button>
            </div>
        </div>


        <!--modal for renaming-->
        <div class="modal fade" id="renameNodeModal" tabindex="-1" aria-labelledby="renameNodeModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content border-0 shadow-sm">
                    <div class="modal-header">
                        <h6 class="modal-title" id="renameNodeModalLabel">Rename Node</h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="text" class="form-control" id="renameNodeInput" placeholder="Enter new node name">
                    </div>
                    <div class="modal-footer justify-content-between">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary btn-sm" id="confirmRenameBtn">Save</button>
                    </div>
                </div>
            </div>
        </div>



        <script src="frontEndScript.js"></script>
        <script src="nav.js"></script>
        <!-- <script src="loadNode.js"></script> -->
        <script>
            fetch("/sidenav")
                .then(response => response.text())
                .then(html => {
                    // Insert sidenav HTML
                    const sideNavDiv = document.getElementById("sideNav");
                    sideNavDiv.insertAdjacentHTML('beforeend', html);

                    // Inserted sidenav HTML does not seem to have the proper CSS toggling properties...
                    // Add event listener to see whenever the user clicks on a dropdown button
                    sideNavDiv.addEventListener('click', function(event) {
                        // Check if the clicked element is a dropdown button
                        if (event.target && event.target.classList.contains("dropdown-btn")) {
                            const dropdownContainer = event.target.nextElementSibling;  // The div right after the button
                            // Toggle dropdown visibility
                            dropdownContainer.style.display = dropdownContainer.style.display === 'block' ? 'none' : 'block';

                            // Toggle green glow for parent folder of dropdown
                            event.target.classList.toggle("active");

                            // Update URL... assumes the class is like "dropdown-btn testFolder2"
                            const folderName = event.target.classList[1];
                            location.hash = `#${folderName}`;
                        }
                    });
                })
                .catch(error => {
                    console.error("Error fetching sideNav:", error);
                });
        </script>
    </div>
</body>

</html>
