<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notes Graph</title>
  <!--Cytoscape script--> 
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <!--EasyMDE-->
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
  <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>

  <!--BOOTSTRAP CSS & JS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  


  <style>
    #cy {
      width: 100%;
      height: 80vh;
      border: 1px solid #000000;
    }
    button {
      margin: 10px;
      padding: 8px 16px;
      font-size: 16px;
    }
    #editorModal {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: rgb(255, 255, 255);
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      z-index: 1000;
      width: 600px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <h2>Notes Visualization</h2>
  <button id="addNodeButton">Add Node</button>
  <div id="cy"></div>

  <!--this is the mark up stuff-->
  <div id="editorModal">
    <textarea id="editorArea"></textarea>
    <br>
    <button id="saveNodeText">Save</button>
    <button id="cancelEditor">Cancel</button>
  </div>

  <!-- this is the editor modal stuff-->
<div id="nodeContextMenu" 
     class="card shadow-sm"
     style="
       position: absolute;
       display: none;
       z-index: 2000;
       width: 180px;
       border-radius: 8px;
       background: #ffffff;
       box-shadow: 0 4px 10px rgba(0,0,0,0.2);
     ">
  <div class="list-group list-group-flush">
    <button class="list-group-item list-group-item-action border-0" id="renameNodeBtn">
    Rename Node
    </button>
    <button class="list-group-item list-group-item-action text-danger border-0" id="deleteNodeBtn">
    Delete Node
    </button>
  </div>
</div>


<!--modal for renaming-->
<div class="modal fade" id="renameNodeModal" tabindex="-1" aria-labelledby="renameNodeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content border-0 shadow-sm">
      <div class="modal-header">
        <h6 class="modal-title" id="renameNodeModalLabel">Rename Node</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" class="form-control" id="renameNodeInput" placeholder="Enter new node name">
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" id="confirmRenameBtn">Save</button>
      </div>
    </div>
  </div>
</div>



  <script src="frontEndScript.js"></script>
</body>
</html>

<!--all i have here is the styling for the cy canvas and the button. and basic html information-->
