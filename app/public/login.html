<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Account Page</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="createAccount">
        <h1>Create An Account</h1>
        <div>
            <label for="username">Username:</label>
            <input id="username" type="text" name="username">
        </div>
        <div>
            <label for="password">Password:</label>
            <input id="password" type="password" name="password">
        </div>
        <div>
            <label for="repeatPassword">Repeat Password:</label>
            <input id="repeatPassword" type="password" name="repeatPassword">
        </div>
        <button id="submit">Create Account</button>
    </div>
    <div id="createAccountMessage"></div>

    <div class="login">
        <h1>Login</h1>
        <div>
            <label for="username">Username:</label>
            <input id="username2" type="text" name="username">
        </div>
        <div>
            <label for="password">Password:</label>
            <input id="password2" type="password" name="password">
        </div>
        <button id="submit2">Login</button>
    </div>
    <div id="loginMessage"></div>
    
    <script src="config.js"></script>
    <script src="login.js"></script>
    
</body>
</html>
